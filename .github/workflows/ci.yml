name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest -q
  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax
        run: for f in frontend/js/*.js; do node --check "$f"; done
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt
          sha256sum -c --ignore-missing gitleaks_${GITLEAKS_VERSION}_checksums.txt
          tar xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks dir . --no-banner
